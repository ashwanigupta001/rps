<!DOCTYPE html>
<html>
<head>
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Mobile Metas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <!-- Site Metas -->
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <!-- favicon  -->
  <link rel="icon" type="image/png" href="assets/images/favicon.jpeg">
  <title>Rama Public School</title>
  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css" />  
  <!-- fonts style -->
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
  <!-- font wesome stylesheet -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
  <!-- Custom styles for this template -->
  <link href="assets/css/styles.css" rel="stylesheet" />
  <!-- responsive style -->
  <link href="assets/css/responsive.css" rel="stylesheet" />
</head>

<body>
  <!-- header section starts -->
  <div id="header"></div>
  <!-- header section ends -->

  <!-- contact section -->
  <section class="contact_section layout_padding-bottom">
    <div class="container">
      <h2 class="main-heading">
        Contact Now
      </h2>
      <p class="text-center">
        We’d love to hear from you. <br />
        Send us a message or visit our campus.
      </p>
      <div class="">
        <div class="contact_section-container">
          <div class="row">
            <div class="col-md-6 mx-auto">
              <div class="contact-form">
                <form action="">
                  <div>
                    <input type="text" placeholder="Name">
                  </div>
                  <div>
                    <input type="text" placeholder="Phone Number">
                  </div>
                  <div>
                    <input type="email" placeholder="Email">
                  </div>
                  <div>
                    <input type="text" placeholder="Message" class="input_message">
                  </div>
                  <div class="d-flex justify-content-center">
                    <button type="submit" class="btn_on-hover">
                      Send
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- end contact section -->

  <!-- google map section -->
  <div class="map-container" style="width:100%; height:400px;">    
    <iframe
      width="100%"
      height="100%"
      style="border:0;"
      loading="lazy"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
      src="https://www.google.com/maps?q=Rama+Public+School+Najafgarh,+Delhi&output=embed">
    </iframe>
  </div>  
  <!-- google map section ends -->

  <!-- footer section -->
  <section class="container-fluid footer_section">
    <p>
      Copyright &copy; 2026 All Rights Reserved By Rama Public School
    </p>
  </section>
  <!-- footer section end-->

  <script type="text/javascript" src="assets/js/jquery-3.4.1.min.js"></script>
  <script type="text/javascript" src="assets/js/bootstrap.js"></script>  
  <!-- Load Header and Menu -->
  <script>
    fetch("header.html")
    .then(response => response.text())
    .then(header => {
        document.getElementById("header").innerHTML = header;
        return fetch("menu-options.html");
    })
    .then(response => response.text())
    .then(menu => {
        document.getElementById("menu-options").innerHTML = menu;
    })
    .catch(error => {
        console.error("Error loading Header/Menu:", error);
    });
  </script>    
</body>
</html>
