    <!-- moving gallery section  -->
    <section class="moving-gallery">
        <div class="gallery-track" id="galleryTrack">
            <script>   
                const track = document.getElementById("galleryTrack");  
                // image count starts from g1 to g44. Increase the count if new images are added
                // newly added images should be named as g45 g46 and so on...
                for (let i = 1; i <= 44; i++) {
                  const img = document.createElement("img");
                  img.src = "assets/images/gallery/g"+i+".jpeg";
                  img.alt = "g"+i+".jpeg";
                  track.appendChild(img);
                }
              </script>      
        </div>
      </section>

    <!-- lightbox js -->
    <script>
        let touchStartX = 0;
        let touchEndX = 0;
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const closeBtn = document.getElementById("lightboxClose");
        const prevBtn = document.getElementById("lightboxPrev");
        const nextBtn = document.getElementById("lightboxNext");

        // Collect all gallery images
        let galleryImages = [];
        let currentIndex = 0;

        function collectImages() {
            galleryImages = Array.from(
            document.querySelectorAll(
                ".gallery-container img, .gallery-track img"
            )
            );
        }

        collectImages();

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = galleryImages[currentIndex].src;
            lightbox.classList.add("active");
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % galleryImages.length;
            openLightbox(currentIndex);
        }

        function showPrev() {
            currentIndex =
            (currentIndex - 1 + galleryImages.length) % galleryImages.length;
            openLightbox(currentIndex);
        }

        // Open on image click
        document.addEventListener("click", (e) => {
            const img = e.target;

            if (
            img.tagName === "IMG" &&
            (img.closest(".gallery-container") ||
            img.closest(".gallery-track"))
            ) {
            collectImages(); // ensure dynamic images included
            const index = galleryImages.indexOf(img);
            openLightbox(index);
            }
        });

        // Navigation
        nextBtn.addEventListener("click", showNext);
        prevBtn.addEventListener("click", showPrev);

        // Close
        closeBtn.addEventListener("click", () => {
            lightbox.classList.remove("active");
        });

        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) {
            lightbox.classList.remove("active");
            }
        });

        // Keyboard support
        document.addEventListener("keydown", (e) => {
            if (!lightbox.classList.contains("active")) return;

            if (e.key === "ArrowRight") showNext();
            if (e.key === "ArrowLeft") showPrev();
            if (e.key === "Escape") lightbox.classList.remove("active");
        });
        lightbox.addEventListener("touchstart", (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightbox.addEventListener("touchend", (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeDistance = touchEndX - touchStartX;
            // Minimum swipe distance threshold
            if (Math.abs(swipeDistance) < 50) return;
            if (swipeDistance < 0) {
                showNext(); // swipe left
            } else {
                showPrev(); // swipe right
            }
        }

    </script>       
    <!-- lightbox js end -->
      
    <script type="text/javascript" src="assets/js/jquery-3.4.1.min.js"></script>
