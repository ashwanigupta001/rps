<!DOCTYPE html>
<html>
<head>
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Mobile Metas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <!-- Site Metas -->
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <!-- favicon  -->
  <link rel="icon" type="image/png" href="assets/images/favicon.jpeg">
  <title>Rama Public School</title>
  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css" />
  <!-- fonts style -->
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
  <!-- font wesome stylesheet -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
  <!-- Custom styles for this template -->
  <link href="assets/css/styles.css" rel="stylesheet" />
  <!-- responsive style -->
  <link href="assets/css/responsive.css" rel="stylesheet" />
</head>

<body id="notice-page">  
  <!-- header section -->
  <div id="header"></div>
  
  <!-- notices section  -->
  <section class="section container">
    <h2>School Notices</h2>
    <iframe
      src="notices/notice-1.html"
      width="100%"
      height="300"
      style="border:none;"
    ></iframe>
    <iframe
      src="notices/notice-2.html"
      width="100%"
      height="200"
      style="border:none;"
    ></iframe>
    <br /><br />    
  </section>

  <!-- notice section end -->

  <br/><br/><br/><br/>

  <!-- footer section -->
  <section class="container-fluid footer_section">
    <p>
      Copyright &copy; 2026 All Rights Reserved By Rama Public School
    </p>
  </section>  

  <script src="assets/js/jquery-3.4.1.min.js"></script>
  <script src="assets/js/bootstrap.js"></script>

  <!-- Load Header and Menu -->
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(header => {
        document.getElementById("header").innerHTML = header;
        return fetch("menu-options.html");
      })
      .then(response => response.text())
      .then(menu => {
        document.getElementById("menu-options").innerHTML = menu;
      })
      .catch(error => {
        console.error("Error loading Header/Menu:", error);
      });
  </script>  
</body>
</html>
